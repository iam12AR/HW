<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokédex Search</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">

    <h1>Search Pokemon</h1>
   

    <!-- Search form -->
    <form id="search-form" class="search-form">
      <input id="pokemon-input" type="text" placeholder="Enter a pokemon name" >
      <button id="search-button" type="submit">Search</button>
    </form>

    <!-- Quick search buttons -->
    <div class="quick-buttons">
      <button type="button" class="quick">Pikachu</button>
      <button type="button" class="quick">Charizard</button>
      <button type="button" class="quick">Bulbasaur</button>
      <button type="button" class="quick">Squirtle</button>
      <button type="button" class="quick">Gengar</button>
      <button type="button" class="quick">Eevee</button>
    </div>

    <!-- MESSAGES: only one is visible at a time. JS switches them with display. -->
    <div id="start-message" class="message">
      Search above, or tap a Pokémon to see its stats.
    </div>

    <div id="loading" class="message loading" style="display: none;">
      Loading...
    </div>

    <div id="error" class="message error" style="display: none;"></div>

    <!-- Pokemon CARD: starts hidden. JS fills in the empty spots, then shows it. -->
    <section id="result" class="card" style="display: none; flex-direction: column;">

      <!-- Top: picture -->
      <div class="picture">
        <span id="pokemon-big-number" class="big-id"></span>
        <img id="pokemon-image" src="" alt="">
      </div>

      <!-- Bottom: details -->
      <div class="info">
        <h2 id="pokemon-name"></h2>
        <p id="pokemon-number" class="dex-number"></p>

        <h3>Types</h3>
        <ul id="pokemon-types" class="tags"></ul>

        <h3>Size</h3>
        <div class="facts">
          <div><span>Height</span><strong id="pokemon-height"></strong></div>
          <div><span>Weight</span><strong id="pokemon-weight"></strong></div>
        </div>

        <h3>Abilities</h3>
        <ul id="pokemon-abilities" class="tags"></ul>

        <h3>Base stats</h3>

        <div class="stat">
          <span class="stat-name">HP</span>
          <span id="number-hp" class="stat-number"></span>
          <div class="bar"><div id="bar-hp" class="bar-fill"></div></div>
        </div>

        <div class="stat">
          <span class="stat-name">Attack</span>
          <span id="number-attack" class="stat-number"></span>
          <div class="bar"><div id="bar-attack" class="bar-fill"></div></div>
        </div>

        <div class="stat">
          <span class="stat-name">Defense</span>
          <span id="number-defense" class="stat-number"></span>
          <div class="bar"><div id="bar-defense" class="bar-fill"></div></div>
        </div>

        <div class="stat">
          <span class="stat-name">Sp. Atk</span>
          <span id="number-special-attack" class="stat-number"></span>
          <div class="bar"><div id="bar-special-attack" class="bar-fill"></div></div>
        </div>

        <div class="stat">
          <span class="stat-name">Sp. Def</span>
          <span id="number-special-defense" class="stat-number"></span>
          <div class="bar"><div id="bar-special-defense" class="bar-fill"></div></div>
        </div>

        <div class="stat">
          <span class="stat-name">Speed</span>
          <span id="number-speed" class="stat-number"></span>
          <div class="bar"><div id="bar-speed" class="bar-fill"></div></div>
        </div>

      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
